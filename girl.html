<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>It's a Girl!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Gloria Hallelujah', cursive;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
    
    /* Background image + gradient overlay */
    background: linear-gradient(rgba(255,204,229,0.6), rgba(255,224,247,0.6)), 
                url('resources/girl_background.png');
    background-size: cover;
    background-position: center;
}

h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 72px;
    color: #e91e63;
    text-shadow: 2px 2px 12px rgba(0,0,0,0.2), 0 0 20px #f8bbd0;
    opacity: 0;
    transform: scale(0.5);
    animation: reveal 1s forwards;
}

@keyframes reveal {
    0% { opacity: 0; transform: scale(0.5); }
    60% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 1; transform: scale(1); }
}

p {
    font-size: 32px;
    color: #f06292;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    opacity: 0;
    animation: reveal 1s forwards 0.5s;
}

.babies {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    opacity: 0;
    animation: reveal 1s forwards 0.8s;
}

.babies span {
    font-size: 70px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-25px); }
}

.blast {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}

.confetti {
    position: absolute;
    font-size: 36px;
    animation: fly 3s ease-out forwards;
}

@keyframes fly {
    0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) rotate(var(--rot)); opacity: 0; }
}
</style>
</head>
<body>

<div class="blast" id="blast"></div>

<h1 id="revealText">🎀 It's a Girl! 🎀</h1>
<p id="subText">Welcome to the world, little princess! 💕</p>

<div class="babies" id="babies">
    <span>👶</span>
    <span>🍼</span>
    <span>🧸</span>
</div>

<audio id="cheerSound" src="https://www.soundjay.com/human/party-horn-01.mp3"></audio>

<script>
const revealText = document.getElementById('revealText');
const subText = document.getElementById('subText');
const babies = document.getElementById('babies');
const blast = document.getElementById('blast');
const cheer = document.getElementById('cheerSound');

// Hide elements initially
revealText.style.display = 'none';
subText.style.display = 'none';
babies.style.display = 'none';

// Reveal after tiny delay
setTimeout(() => {
    revealText.style.display = 'block';
    subText.style.display = 'block';
    babies.style.display = 'flex';

    // Play sound
    cheer.play().catch(()=>{console.log("Sound autoplay blocked")});

    // Generate BIG blast
    const confettiEmojis = [
        '🎀','💖','🍼','👶','🧸','💫','✨','🎉','👗','🩰','🧦','🩳','🎈','👟'
    ];

    for(let i=0;i<200;i++){
        const c = document.createElement('div');
        c.className = 'confetti';
        c.textContent = confettiEmojis[Math.floor(Math.random()*confettiEmojis.length)];
        c.style.left = Math.random()*window.innerWidth + 'px';
        c.style.top = Math.random()*100 + 'px';
        c.style.setProperty('--x', (Math.random()*1600 - 800) + 'px'); 
        c.style.setProperty('--y', (Math.random()*1000 + 400) + 'px');
        c.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
        c.style.animationDelay = (Math.random()*0.5)+'s';
        blast.appendChild(c);
    }
}, 100);
</script>

</body>
</html>
